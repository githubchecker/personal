<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E65100"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565C0"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="480" rx="20" fill="#FBFBFC"/>
  <rect x="1" y="1" width="958" height="478" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="480" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#111827">
    'List Comprehension Syntax Breakdown'
  </text>

  <!-- TOP CALLOUT 1: Output Expression -->
  <g filter="url(#card-shadow)">
    <rect x="70" y="90" width="230" height="70" rx="12" fill="#E0F2F1" stroke="#80CBC4" stroke-width="1.5"/>
    <text x="95" y="120" font-family="sans-serif" font-size="20">🔒</text>
    <text x="125" y="120" font-family="sans-serif" font-size="15" font-weight="700" fill="#004D40">1. Output Expression</text>
    <text x="125" y="142" font-family="'Fira Code', monospace" font-size="14" fill="#00695C">x * 2</text>
  </g>
  <!-- Arrow from Top 1 to x * 2 -->
  <path d="M 185 160 L 225 210" fill="none" stroke="#E65100" stroke-width="2.5" marker-end="url(#arrow-down)"/>

  <!-- TOP CALLOUT 2: Iterable Data Source -->
  <g filter="url(#card-shadow)">
    <rect x="520" y="90" width="240" height="70" rx="12" fill="#E8EAF6" stroke="#C5CAE9" stroke-width="1.5"/>
    <text x="540" y="120" font-family="sans-serif" font-size="20">📦</text>
    <text x="570" y="120" font-family="sans-serif" font-size="15" font-weight="700" fill="#1A237E">3. Data Source</text>
    <text x="570" y="142" font-family="'Fira Code', monospace" font-size="14" fill="#283593">numbers</text>
  </g>
  <!-- Arrow from Top 2 to numbers -->
  <path d="M 640 160 L 590 210" fill="none" stroke="#E65100" stroke-width="2.5" marker-end="url(#arrow-down)"/>

  <!-- CENTRAL CODE BAR -->
  <g filter="url(#card-shadow)">
    <rect x="130" y="215" width="700" height="75" rx="14" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
    <text x="160" y="262" font-family="'Fira Code', Consolas, Monaco, monospace" font-size="28" font-weight="700">
      <tspan fill="#6B7280">[</tspan>
      <tspan fill="#0D47A1"> x * 2 </tspan>
      <tspan fill="#D84315"> for </tspan>
      <tspan fill="#1565C0"> x </tspan>
      <tspan fill="#D84315"> in </tspan>
      <tspan fill="#2E7D32"> numbers </tspan>
      <tspan fill="#D84315"> if </tspan>
      <tspan fill="#8E24AA"> x % 2 == 0 </tspan>
      <tspan fill="#6B7280">]</tspan>
    </text>
  </g>

  <!-- BOTTOM CALLOUT 1: Loop Variable -->
  <g filter="url(#card-shadow)">
    <rect x="230" y="340" width="220" height="70" rx="12" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1.5"/>
    <text x="250" y="370" font-family="sans-serif" font-size="20">🏷️</text>
    <text x="280" y="370" font-family="sans-serif" font-size="15" font-weight="700" fill="#1B5E20">2. Loop Variable</text>
    <text x="280" y="392" font-family="'Fira Code', monospace" font-size="14" fill="#2E7D32">x (each item)</text>
  </g>
  <!-- Arrow from Bottom 1 to for x -->
  <path d="M 340 340 L 380 295" fill="none" stroke="#1565C0" stroke-width="2.5" marker-end="url(#arrow-up)"/>

  <!-- BOTTOM CALLOUT 2: Filter Condition -->
  <g filter="url(#card-shadow)">
    <rect x="580" y="335" width="310" height="85" rx="12" fill="#FFF3E0" stroke="#FFCC80" stroke-width="1.5"/>
    <text x="600" y="365" font-family="sans-serif" font-size="20">🔍</text>
    <text x="630" y="365" font-family="sans-serif" font-size="15" font-weight="700" fill="#BF360C">4. Filter (Optional)</text>
    <text x="630" y="388" font-family="sans-serif" font-size="13" fill="#D84315">Only keeps items where expression</text>
    <text x="630" y="405" font-family="sans-serif" font-size="13" font-weight="600" fill="#D84315">evaluates to True</text>
  </g>
  <!-- Arrow from Bottom 2 to if x % 2 == 0 -->
  <path d="M 720 335 L 720 295" fill="none" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Bottom Tagline -->
  <text x="480" y="455" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-style="italic" font-weight="500" text-anchor="middle" fill="#4B5563">
    'Like an automated espresso bar: filter the beans, extract the shot, serve!'
  </text>
</svg>